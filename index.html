<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra AI Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 { text-align: center; margin-bottom: 5px; color: #007aff; }
        label { font-size: 14px; opacity: 0.8; }
        textarea, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            background: #007aff;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <h2>Hydra AI Studio ⚡</h2>
    
    <label for="prompt">Промпт для генерации видео:</label>
    <textarea id="prompt" rows="4" placeholder="Fast paced artistic showcase, fashion model..."></textarea>
    
    <label for="resolution">Качество видео:</label>
    <select id="resolution">
        <option value="720p">720p (Быстро / Экономно)</option>
        <option value="1080p">1080p (Максимальное с аудио)</option>
    </select>

    <button onclick="generateVideo()">🚀 Сгенерировать видео</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function generateVideo() {
            const prompt = document.getElementById('prompt').value;
            const res = document.getElementById('resolution').value;

            if (!prompt) {
                alert("Пожалуйста, введите промпт!");
                return;
            }

            tg.sendData(JSON.stringify({
                action: "generate_video",
                prompt: prompt,
                resolution: res
            }));
            
            tg.close();
        }
    </script>
</body>
</html>
