<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hydra AI Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0e0e10;
            --card-bg: #18181b;
            --accent-color: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6, #3b82f6);
            --text-main: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px 12px 80px 12px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 4px 8px;
        }
        .brand {
            font-size: 18px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .cat-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-item.active {
            border-color: var(--accent-color);
            background: rgba(139, 92, 246, 0.1);
        }
        .cat-icon { font-size: 20px; margin-bottom: 4px; }
        .cat-name { font-size: 10px; color: var(--text-secondary); font-weight: 500; }

        .generator-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        
        label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px; }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #09090b;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }
        textarea:focus, select:focus { border-color: var(--accent-color); }
        
        /* Блок видео настроек */
        .video-params {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 14px;
            background: #09090b;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type=range] {
            flex: 1;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .duration-val {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-color);
            min-width: 55px;
            text-align: right;
        }

        .generate-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-box {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .result-box img, .result-box video, .result-box audio {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
        }

        .chat-result-text {
            text-align: left;
            background: #09090b;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .status-msg {
            font-size: 13px;
            color: #facc15;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(14, 14, 16, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active { color: var(--accent-color); font-weight: 600; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">HYDRA AI ⚡</div>
        <div class="balance-badge">
            ⚙ <span id="coins">150</span> монет
        </div>
    </div>

    <!-- Категории -->
    <div class="categories">
        <div class="cat-item active" id="cat-image" onclick="selectCategory('image')">
            <div class="cat-icon">🖼</div>
            <div class="cat-name">Картинка</div>
        </div>
        <div class="cat-item" id="cat-video" onclick="selectCategory('video')">
            <div class="cat-icon">🎥</div>
            <div class="cat-name">Видео</div>
        </div>
        <div class="cat-item" id="cat-audio" onclick="selectCategory('audio')">
            <div class="cat-icon">🎵</div>
            <div class="cat-name">Аудио</div>
        </div>
        <div class="cat-item" id="cat-chat" onclick="selectCategory('chat')">
            <div class="cat-icon">💬</div>
            <div class="cat-name">Чат AI</div>
        </div>
    </div>

    <div class="generator-box">
        <div class="section-title" id="gen-title">🖼 Генерация изображений</div>
        
        <label for="model-select">Выберите нейросеть:</label>
        <select id="model-select" onchange="onModelChange()"></select>

        <!-- Настройки видео -->
        <div class="video-params" id="video-params">
            <div>
                <label for="video-res">Разрешение видео:</label>
                <select id="video-res" onchange="updatePrice()" style="margin-bottom:0;">
                    <option value="480p">480p (SD — Эконом)</option>
                    <option value="720p" selected>720p (HD — Стандарт)</option>
                    <option value="1080p">1080p (Full HD — Макс.)</option>
                </select>
            </div>
            <div>
                <label>Длительность видео:</label>
                <div class="slider-container">
                    <input type="range" id="video-dur" min="1" max="30" value="5" oninput="updatePrice()">
                    <span class="duration-val" id="dur-val">5 сек</span>
                </div>
            </div>
        </div>

        <label for="prompt" id="prompt-label">Описание запроса:</label>
        <textarea id="prompt" rows="3" placeholder="Опишите, что вы хотите сгенерировать..."></textarea>

        <button class="generate-btn" id="gen-btn" onclick="generateMedia()">🚀 Сгенерировать</button>
        <div class="status-msg" id="status-msg">⏳ Идет обработка запроса... Пожалуйста, подождите.</div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="result-box">
        <div class="section-title">✨ Готовый результат:</div>
        <img id="image-result" style="display:none;" />
        <video id="video-result" controls autoplay loop style="display:none;"></video>
        <audio id="audio-result" controls style="display:none;"></audio>
        <div id="chat-result" class="chat-result-text" style="display:none;"></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active"><div class="nav-icon">🏠</div>Главная</div>
        <div class="nav-item" onclick="alert('История генераций')"><div class="nav-icon">📂</div>История</div>
        <div class="nav-item" onclick="alert('Баланс: 150 монет')"><div class="nav-icon">👤</div>Профиль</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentCategory = 'image';

        const categoryMeta = {
            image: {
                title: '🖼 Генерация изображений',
                placeholder: 'Опишите желаемое изображение в деталях...',
                models: [
                    { id: 'flux-schnell', name: 'FLUX 1.1 Schnell (Быстро)', basePrice: 10 },
                    { id: 'flux-pro', name: 'FLUX 1.1 Pro (Макс. качество)', basePrice: 25 },
                    { id: 'recraft-v3', name: 'Recraft V3 (Дизайн и лого)', basePrice: 20 },
                    { id: 'ideogram-v2', name: 'Ideogram v2 (Текст на картинках)', basePrice: 30 }
                ]
            },
            video: {
                title: '🎥 Генерация видео',
                placeholder: 'Опишите сюжет, персонажей и движение камеры в видео...',
                models: [
                    { id: 'kling-3.0', name: 'Kling 3.0 Pro (До 15 сек, Native 4K/HD)', basePrice: 12, maxDuration: 15 },
                    { id: 'wan-3.0', name: 'Wan 3.0 Ultra (До 30 сек)', basePrice: 10, maxDuration: 30 },
                    { id: 'seedance-2.5', name: 'Bytedance Seedance 2.5 (До 30 сек с аудио)', basePrice: 8, maxDuration: 30 }
                ]
            },
            audio: {
                title: '🎵 Генерация музыки и звуков',
                placeholder: 'Опишите жанр, инструменты, настроение или введите текст...',
                models: [
                    { id: 'suno-v4', name: 'Suno v4 (Музыка и песни)', basePrice: 30 },
                    { id: 'elevenlabs', name: 'ElevenLabs (Озвучка текста)', basePrice: 15 }
                ]
            },
            chat: {
                title: '💬 Вопрос ИИ-Ассистенту',
                placeholder: 'Задайте любой вопрос, попросите написать код или текст...',
                models: [
                    { id: 'gpt-4o', name: 'ChatGPT 4o (Умный ассистент)', basePrice: 5 },
                    { id: 'claude-sonnet', name: 'Claude 3.5 Sonnet (Код и аналитика)', basePrice: 5 }
                ]
            }
        };

        function selectCategory(cat) {
            currentCategory = cat;
            
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`cat-${cat}`).classList.add('active');

            const meta = categoryMeta[cat];
            document.getElementById('gen-title').innerText = meta.title;
            document.getElementById('prompt').placeholder = meta.placeholder;

            const videoParams = document.getElementById('video-params');
            videoParams.style.display = (cat === 'video') ? 'flex' : 'none';

            const select = document.getElementById('model-select');
            select.innerHTML = '';
            
            meta.models.forEach(model => {
                const opt = document.createElement('option');
                opt.value = model.id;
                opt.innerText = model.name;
                select.appendChild(opt);
            });

            onModelChange();
        }

        function onModelChange() {
            if (currentCategory === 'video') {
                const selectedModelId = document.getElementById('model-select').value;
                const modelObj = categoryMeta.video.models.find(m => m.id === selectedModelId);
                const slider = document.getElementById('video-dur');
                
                if (modelObj) {
                    slider.max = modelObj.maxDuration;
                    if (parseInt(slider.value) > modelObj.maxDuration) {
                        slider.value = modelObj.maxDuration;
                    }
                }
            }
            updatePrice();
        }

        function updatePrice() {
            const select = document.getElementById('model-select');
            const selectedModelId = select.value;
            const meta = categoryMeta[currentCategory];
            const modelObj = meta.models.find(m => m.id === selectedModelId);
            
            if (!modelObj) return;

            let finalPrice = modelObj.basePrice;

            if (currentCategory === 'video') {
                const duration = parseInt(document.getElementById('video-dur').value) || 5;
                const resolution = document.getElementById('video-res').value;

                document.getElementById('dur-val').innerText = `${duration} сек`;

                let resMult = 1;
                if (resolution === '480p') resMult = 0.7;
                if (resolution === '1080p') resMult = 1.5;

                finalPrice = Math.round(modelObj.basePrice * duration * resMult);
            }

            document.getElementById('gen-btn').innerText = `🚀 Сгенерировать (-${finalPrice} монет)`;
        }

        async function generateMedia() {
            const prompt = document.getElementById('prompt').value;
            const model = document.getElementById('model-select').value;
            const btn = document.getElementById('gen-btn');
            const statusMsg = document.getElementById('status-msg');
            const resultBox = document.getElementById('result-box');
            
            const imgElem = document.getElementById('image-result');
            const videoElem = document.getElementById('video-result');
            const audioElem = document.getElementById('audio-result');
            const chatElem = document.getElementById('chat-result');

            if (!prompt) {
                alert("Пожалуйста, введите запрос!");
                return;
            }

            btn.disabled = true;
            statusMsg.style.display = "block";
            resultBox.style.display = "none";
            imgElem.style.display = "none";
            videoElem.style.display = "none";
            audioElem.style.display = "none";
            chatElem.style.display = "none";

            const resolution = document.getElementById('video-res').value;
            const duration = document.getElementById('video-dur').value;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt, 
                        model, 
                        category: currentCategory,
                        resolution,
                        duration
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (currentCategory === 'video') {
                        videoElem.src = data.result.url;
                        videoElem.style.display = "block";
                    } else if (currentCategory === 'image') {
                        imgElem.src = data.result.url;
                        imgElem.style.display = "block";
                    } else if (currentCategory === 'audio') {
                        audioElem.src = data.result.url;
                        audioElem.style.display = "block";
                    } else if (currentCategory === 'chat') {
                        chatElem.innerText = data.result.text || data.result.url;
                        chatElem.style.display = "block";
                    }

                    resultBox.style.display = "block";
                    resultBox.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Ошибка: " + (data.error || "Не удалось сгенерировать"));
                }
            } catch (err) {
                alert("Ошибка сети или сервера: " + err.message);
            } finally {
                btn.disabled = false;
                updatePrice();
                statusMsg.style.display = "none";
            }
        }

        selectCategory('image');
    </script>
</body>
</html>
